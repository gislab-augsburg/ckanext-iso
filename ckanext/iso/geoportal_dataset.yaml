scheming_version: 2
  dataset_type: geoportal
  about: The default Munich(LHM) catalog dataset schema for Iso19115 / Iso 19139 metadata from GeoPortal
  about_url: http://github.com/ckan/ckanext-scheming
  
  dataset_fields:
  
  # Feld GP
  - field_name: ident_individual
    label: Abteilung / Unterabteilung
    form_snippet: text_lhm.html
    # required: true
    is_info: true
    info_text: 'MDK Feld: ident_individual, pdf_nr: 2, geonetwork_nr: 8'
  
  # Feld Master
  - field_name: title
    label: Title
    preset: title
    form_snippet: large_text_lhm.html
    form_placeholder: Thema | NAME_DER_TABELLE
    is_info: true
    info_text: 'Thema | NAME_DER_TABELLE. Der Titel beteht aus dem Thema (für Geodatenpool: ehemals Datenbestand) und dem Namen der Tabelle in der Datenbank.'
    required: true
  
  # Feld Master
  - field_name: notes
    label: Description
    form_snippet: markdown_lhm.html
    form_placeholder: eg. Some useful notes about the data
    is_info: true
    info_text: Klare und prägnante Beschreibung des Datensatzes, damit auch Laien den Inhalt verstehen und einschätzen können. Dazu können neben dem konkreten Inhalt z.B. die räumliche Abdeckung, Vollständigkeit, Urheberschaft und Aktualität gehören.
    required: true
  
  # Feld Master
  - field_name: tag_string
    label: Schlagworte
    preset: tag_string_autocomplete
    form_snippet: text_lhm.html
    form_placeholder: z.B. Gesundheit; Umwelt;
    is_info: true
    info_text: Schlagworte sind i.d.R. Substantive zur inhaltlichen Beschreibung des Datensatzes. Es können mehrere Schlagworte vergeben werden. 
  
  # Feld GP
  - field_name: ident_topic
    label: Thematik
    preset: select_lhm
    # required: true
    is_info: true
    info_text: 'MDK Feld: ident_topic, pdf_nr: 7, geonetwork_nr: 14, CSW Pfad: gmd:MD_Metadata/gmd:identificationInfo/srv:SV_ServiceIdentification/gmd:topicCategory/gmd:MD_TopicCategoryCode, Codelist: https://standards.iso.org/iso/19139/resources/gmxCodelists.xml - MD_TopicCategoryCode '
    choices:
    - value: ''
    - value: farming
    - value: biota
    - value: boundaries
    - value: climatologyMeteorologyAtmosphere
    - value: economy
    - value: elevation
    - value: environment
    - value: geoscientificInformation
    - value: health
    - value: imageryBaseMapsEarthCover
    - value: intelligenceMilitary
    - value: inlandWaters
    - value: location
    - value: oceans
    - value: planningCadastre
    - value: society
    - value: structure
    - value: transportation
    - value: utilitiesCommunication
  
