resource_fields:

# Feld Master
- field_name: url
  label: URL
  preset: resource_url_upload

# Feld Master
- field_name: name
  label: Name
  form_snippet: text_lhm.html
  is_info: true
  info_text: Tabellenname in der Datenbank
  #validators: scheming_required
  required: true

# Feld Master
- field_name: description
  label: Beschreibung
  form_snippet: markdown_lhm.html
  is_info: true
  info_text: Beschreibung der Ressource, z.B. 'Tabelle im stadtweit verfügbaren Geodatenpool'. Kann auch Verwendungszweck /-möglichkeiten der Ressource enthalten.
  #validators: scheming_required
  required: true

# Feld Master
- field_name: format
  label: Format
  preset: select_lhm
  is_info: true
  info_text: Dateiformat der Ressource
  #validators: scheming_required
  required: true 
  choices:
  - value: oracle-db
    label: Oracle-DB
  - value: XLSX
    label: XLSX
  - value: PDF
    label: PDF
  - value: WCS
    label: WCS
  - value: WFS
    label: WFS
  - value: WMS
    label: WMS
  - value: WMTS
    label: WMTS
  - value: JSON
    label: JSON
  - value: XML/GML
    label: XML/GML
  - value: ArcGIS Kartenservice
    label: ArcGIS Kartenservice
  - value: URL
    label: URL
  - value: Link
    label: Link

